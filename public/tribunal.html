<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tribunal del Auditorio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<!-- Arranca con el fondo de WhatsApp Claro -->
<body class="modo-claro" style="display: flex; flex-direction: column; justify-content: center; align-items: center; background-image: url('img/fondo-tema-claro.jpg'); background-size: cover;">
    
    <div style="position: absolute; top: 20px; left: 30px; font-size: 1.8rem; font-weight: bold; background-color: rgba(255,255,255,0.7); padding: 10px 20px; border-radius: 10px;" id="titulo-cabecera">
        ⚖️ El Tribunal del Auditorio
    </div>
    
    <div id="contador-participantes" class="contador-participantes">👥 Participantes: 0</div>
    
    <!-- Botón de Modo Oscuro -->
    <button id="btn-tema" class="btn-extra" style="position: absolute; bottom: 20px; right: 30px; z-index: 100;">🌙 Modo Oscuro</button>

    <!-- Contenedor Principal (Dividido en Pregunta y QR) -->
    <div style="display: flex; gap: 40px; max-width: 1200px; width: 100%; align-items: center; background-color: rgba(255,255,255,0.9); padding: 40px; border-radius: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.1);" id="caja-principal">
        
        <!-- Columna Izquierda: La frase y votos -->
        <div style="flex: 2; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 30px;">
            <h1 id="texto-afirmacion" style="font-size: 3.2rem; line-height: 1.3;">Presioná ESPACIO para mostrar la primera afirmación</h1>
            
            <div id="panel-resultados" style="display: none; width: 100%; justify-content: space-around; margin-top: 10px;">
                <div id="caja-realidad" style="background-color: #43a047; padding: 20px 40px; border-radius: 15px; border: 4px solid transparent; width: 40%;">
                    <h3 style="font-size: 2rem; color: white;">REALIDAD</h3>
                    <div id="votos-realidad" style="font-size: 4rem; color: white; font-weight: bold;">0</div>
                </div>
                <div id="caja-mito" style="background-color: #e53935; padding: 20px 40px; border-radius: 15px; border: 4px solid transparent; width: 40%;">
                    <h3 style="font-size: 2rem; color: white;">MITO</h3>
                    <div id="votos-mito" style="font-size: 4rem; color: white; font-weight: bold;">0</div>
                </div>
            </div>

            <p id="instruccion-tribunal" style="color: #54656f; font-size: 1.5rem; font-style: italic; font-weight: bold;"></p>
        </div>

        <!-- Columna Derecha: QR Lateral -->
        <div id="caja-qr" class="overlay-qr" style="background-color: transparent; border: 2px dashed #888;">
            <h3 id="titulo-qr">¡Votá acá!</h3>
            <button id="btn-mostrar-qr" class="btn-extra">🔍 Agrandar QR</button>
            <div class="qr-placeholder" style="margin-top: 15px;">
                <!-- ACORDATE DE PONER TU LINK DE NETLIFY ACÁ -->
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=https://simulador-chat-juv.onrender.com/mobile.html" alt="Código QR para votar">
            </div>
            <p id="texto-qr">Escaneá con tu celular</p>
        </div>

    </div>

    <!-- OVERLAY DEL QR GIGANTE -->
    <div id="overlay-qr-gigante" style="display: none;">
        <div class="qr-gigante-contenido">
            <h3>¡Votá acá!</h3>
            <div class="qr-placeholder-gigante">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=https://simulador-chat-juv.onrender.com/mobile.html" alt="Código QR gigante">
            </div>
            <p>Escaneá con tu celular</p>
            <button id="btn-ocultar-qr" class="btn-extra" style="margin-top: 20px;">Cerrar QR</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/tribunal.js"></script>
</body>
</html>
