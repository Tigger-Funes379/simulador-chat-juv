<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tribunal del Auditorio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="modo-oscuro" style="justify-content: center; align-items: center; background-color: #0b141a;">
    <div style="position: absolute; top: 30px; left: 30px; color: #ffeb3b; font-size: 1.5rem; font-weight: bold;">
        ⚖️ El Tribunal del Auditorio
    </div>
    
    <div id="contador-participantes" class="contador-participantes">👥 Participantes: 0</div>

    <div style="display: flex; flex-direction: column; align-items: center; max-width: 900px; text-align: center; gap: 40px; width: 100%;">
        
        <h1 id="texto-afirmacion" style="font-size: 3.5rem; line-height: 1.3; color: white;">Presioná ESPACIO para mostrar la primera afirmación</h1>
        
        <!-- Panel de resultados oculto por defecto -->
        <div id="panel-resultados" style="display: none; width: 100%; justify-content: space-around; margin-top: 20px;">
            <div id="caja-realidad" style="background-color: #43a047; padding: 20px 40px; border-radius: 15px; border: 3px solid transparent;">
                <h3 style="font-size: 2rem; color: white;">REALIDAD</h3>
                <div id="votos-realidad" style="font-size: 4rem; color: white; font-weight: bold;">0</div>
            </div>
            <div id="caja-mito" style="background-color: #e53935; padding: 20px 40px; border-radius: 15px; border: 3px solid transparent;">
                <h3 style="font-size: 2rem; color: white;">MITO</h3>
                <div id="votos-mito" style="font-size: 4rem; color: white; font-weight: bold;">0</div>
            </div>
        </div>

        <p id="instruccion-tribunal" style="color: #8696a0; font-size: 1.5rem; font-style: italic;"></p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/tribunal.js"></script>
</body>
</html>
