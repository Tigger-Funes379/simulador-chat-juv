<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador - Votación</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body id="mobile-body">
    <!-- FASE 1: SIMULADOR (Opciones A, B, C) -->
    <div id="pantalla-celular" style="display: flex;">
        <h2>Elige tu opción</h2>
        <div id="opciones-container"></div>
    </div>

    <!-- FASE 2: TRIBUNAL (Mito o Realidad) -->
    <div id="pantalla-tribunal" style="display: none; flex-direction: column; align-items: center; width: 100%; max-width: 400px; gap: 30px;">
        <h2 id="titulo-tribunal" style="color: #ffeb3b; font-size: 2.5rem;">Atento al proyector...</h2>
        
        <div id="opciones-tribunal" style="display: none; width: 100%; flex-direction: column; gap: 20px;">
            <button class="btn-voto btn-realidad" onclick="votarTribunal('realidad')">🟩 REALIDAD</button>
            <button class="btn-voto btn-mito" onclick="votarTribunal('mito')">🟥 MITO</button>
        </div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/mobile.js"></script>
</body>
</html>
